name: ci

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Get the repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # MKDOCS
      # -------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Create MkDocs cache ID
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Cache MkDocs
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build

      # -------------------------
      # SLIDEV
      # -------------------------

      # -------------------------
      # SLIDEV
      # -------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - name: Install Slidev dependencies
        working-directory: slides
        run: npm ci

      - name: Build Slidev presentation
        working-directory: slides
        run: |
          npm run build -- \
            --base /National-5-Teacher-Notes/slides/ \
            --out ../site/slides
      # -------------------------
      # DEPLOY
      # -------------------------

      - name: Deploy combined MkDocs and Slidev site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site